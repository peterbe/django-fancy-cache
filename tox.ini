# Tox (http://tox.testrun.org/) is a tool for running tests
# in multiple virtualenvs. This configuration file will run the
# test suite on all supported python versions. To use it, "pip install tox"
# and then run "tox" from this directory.

[tox]
envlist = py38-dj32,
          py39-dj32,
          py310-dj32,
          py311-dj32,
          py38-dj41,
          py39-dj41,
          py310-dj41,
          py38-dj42,
          py39-dj42,
          py310-dj42,
          py311-dj42,
          py312-dj42,
          py310-dj52,
          py311-dj52,
          py312-dj52,
          py313-dj52,
          py314-dj52,
          py312-dj60,
          py313-dj60,
          py314-dj60,
          py312-dj61,
          py313-dj61,
          py314-dj61
#         PyPy disabled per issue #69:
#         https://github.com/peterbe/django-fancy-cache/issues/69
#         pypy-3-dj22,
#         pypy-3-dj31,
#         pypy-3-dj32,
#         pypy-3-dj40

[gh-actions]
python =
  3.8: py38
  3.9: py39
  3.10: py310
  3.11: py311
  3.12: py312
  3.13: py313
  3.14: py314
# pypy-3.8: pypy-3

[testenv]
basepython =
    py38: python3.8
    py39: python3.9
    py310: python3.10
    py311: python3.11
    py312: python3.12
    py313: python3.13
    py314: python3.14
#   pypy-3: pypy3

deps =
    dj32: Django>=3.2.0, <4.0.0
    dj41: Django>=4.1.0, <4.2.0
    dj42: Django>=4.2.0, <4.3.0
    dj52: Django>=5.2.0, <5.3.0
    dj60: Django>=6.0.0, <6.1.0
    dj61: Django>=6.1.0, <6.2.0
    mock

usedevelop = true

commands = pip install -r requirements.txt
           {envpython} runtests.py
