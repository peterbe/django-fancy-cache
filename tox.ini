# Tox (http://tox.testrun.org/) is a tool for running tests
# in multiple virtualenvs. This configuration file will run the
# test suite on all supported python versions. To use it, "pip install tox"
# and then run "tox" from this directory.

[tox]
envlist = py{310,311,312}-dj42,
          py{310,311,312,313,314}-dj52,
          py{312,313,314}-dj{60,61}
#         PyPy disabled per issue #69:
#         https://github.com/peterbe/django-fancy-cache/issues/69

[gh-actions]
python =
  3.10: py310
  3.11: py311
  3.12: py312
  3.13: py313
  3.14: py314

[testenv]
# Each Django factor installs the newest patch release of that series, so
# the matrix tracks security releases without editing this file.
deps =
    dj42: Django>=4.2,<5.0
    dj52: Django>=5.2,<6.0
    dj60: Django>=6.0,<6.1
    dj61: Django>=6.1,<6.2
    -r requirements.txt

usedevelop = true

commands = python runtests.py
