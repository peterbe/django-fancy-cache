---
name: Run black

on: [push, pull_request]

jobs:
  black:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Pinned so a new Python release can't break the pinned black.
          python-version: '3.13'
      - name: install black
        run: pip install black==22.3.0
      - name: Black
        run: black . --check
