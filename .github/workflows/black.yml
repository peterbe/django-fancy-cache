---
name: Run black

on: [push, pull_request]

jobs:
  black:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # black 22.3.0 crashes on Python 3.14 (asyncio change), so run it on 3.13.
          python-version: '3.13'
      - name: install black
        run: pip install black==22.3.0
      - name: Black
        run: black . --check
